<!DOCTYPE html>

<style>
        body {
            font-family: 'Public Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.05);
        }

        .input-field {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #003633;
            border-width: 2px;
            outline: none;
            box-shadow: 0 0 0 1px #003633;
        }

        .input-label {
            color: #404847;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="bg-surface-lowest dark:bg-surface-container-lowest w-full top-0 sticky border-b border-outline-variant dark:border-outline z-40">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-max-width mx-desktop">
<button class="text-primary dark:text-primary-fixed hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 rounded-full transition-colors active:scale-95 duration-150 p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed text-center flex-1 pr-10">HandyLink</h1>
<!-- Empty div for flex balance -->
<div class="w-10"></div>
</div>
</header>
<main class="flex-1 w-full max-w-max-width mx-desktop px-margin-mobile py-lg">
<!-- Progress Indicator -->
<div class="mb-md flex flex-col items-center justify-center">
<span class="font-label-md text-label-md text-on-surface-variant mb-xs">Step 3 of 4</span>
<div class="flex gap-2 w-full max-w-xs justify-center">
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-surface-container-high"></div>
</div>
</div>
<div class="max-w-2xl mx-auto">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xl text-center md:text-left">Where should Sarah go?</h2>
<div class="glass-card rounded-xl p-md mb-lg">
<form class="space-y-md">
<!-- Address Section -->
<div class="space-y-sm">
<h3 class="font-headline-md text-headline-md text-on-surface mb-sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary">location_on</span>
                            Service Address
                        </h3>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md input-label" for="street">Street Address</label>
<input class="input-field px-4 py-3 w-full bg-surface-lowest text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="street" placeholder="e.g. 123 Main St" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md input-label" for="apt">Apt/Suite (Optional)</label>
<input class="input-field px-4 py-3 w-full bg-surface-lowest text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="apt" placeholder="e.g. Apt 4B" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md input-label" for="city">City</label>
<input class="input-field px-4 py-3 w-full bg-surface-lowest text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="city" placeholder="City" type="text"/>
</div>
<div class="grid grid-cols-2 gap-sm">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md input-label" for="state">State</label>
<select class="input-field px-4 py-3 w-full bg-surface-lowest text-body-md font-body-md text-on-surface appearance-none" id="state">
<option disabled="" selected="" value="">State</option>
<option value="CA">CA</option>
<option value="NY">NY</option>
<option value="TX">TX</option>
</select>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md input-label" for="zip">ZIP Code</label>
<input class="input-field px-4 py-3 w-full bg-surface-lowest text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="zip" placeholder="ZIP" type="text"/>
</div>
</div>
</div>
<div class="flex items-center gap-3 pt-sm">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-lowest cursor-pointer" id="save-default" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface cursor-pointer select-none" for="save-default">Save as Default Address</label>
</div>
</div>
<hr class="border-outline-variant/30 my-md"/>
<!-- Contact Section -->
<div class="space-y-sm">
<h3 class="font-headline-md text-headline-md text-on-surface mb-sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary">call</span>
                            Contact Detail
                        </h3>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md input-label" for="phone">Phone Number</label>
<input class="input-field px-4 py-3 w-full bg-surface-lowest text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="phone" placeholder="(555) 123-4567" type="tel"/>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">So the artisan can reach you if needed.</p>
</div>
</div>
</form>
</div>
<!-- Bottom Action -->
<div class="fixed md:static bottom-0 left-0 w-full p-margin-mobile md:p-0 bg-surface md:bg-transparent z-40 border-t md:border-none border-outline-variant/20 shadow-[0_-4px_12px_0_rgba(0,0,0,0.05)] md:shadow-none pb-safe md:pb-0">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-body-md text-body-md font-semibold h-12 rounded-[16px] transition-all active:scale-[0.98] flex items-center justify-center shadow-md">
                    Review Booking
                </button>
</div>
</div>
</main>
</body></html>

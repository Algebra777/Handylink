<style>
        /* Custom scrollbar for horizontal lists */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body-md h-screen flex flex-col antialiased overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/70 dark:bg-surface-dim/70 backdrop-blur-md border-b border-outline-variant/30 shadow-sm">
<div class="flex justify-between items-center px-4 w-full h-16">
<button class="text-on-surface-variant hover:bg-primary/5 transition-colors p-2 rounded-full active:scale-95 duration-200 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile text-primary tracking-tight truncate px-4">Review Documents</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-16 pb-[140px] overflow-y-auto px-4 py-6 flex flex-col gap-6">
<!-- Artisan Profile Summary -->
<section class="bg-surface-container-lowest rounded-xl p-4 shadow-sm border border-outline-variant/30 flex items-center gap-4">
<div class="w-16 h-16 rounded-full bg-surface-container overflow-hidden shrink-0">
<img class="w-full h-full object-cover" data-alt="Close up professional portrait of a male electrician in a clean blue uniform, well-lit studio environment, showing a subtle confident smile, sharp focus, modern corporate headshot style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZoryToHuKy9vnnLUkmAeE7iPPfbuN-0QHQ-pi_IXb6yOtDWzysBFA_ExVoyO3K_HQIs6FrJcTqk0vVmiIP62ya_9WMPY3NdhS9ir41MP0kXcmd7C-s9qDDo8p_Rl8F47-TvHdcLE_ZcXqctlGZjuIEFR08v_NAtE0P1EbZ2PsJFxNID_1O5ptLTHFjwIcD70efpX2shoZotQx9KDA29tI3z5G29Dcn-EeYLzpzCAAwzWCZM4n2tZ5"/>
</div>
<div class="flex-1 min-w-0">
<h2 class="font-headline-sm text-headline-sm-mobile text-on-surface truncate">Marcus Thorne</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant truncate">Master Electrician • ID: #98421</p>
<div class="mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] text-tertiary-container" data-icon="pending_actions">pending_actions</span>
<span class="font-label-sm text-label-sm text-tertiary-container">Pending Vetting</span>
</div>
</div>
</section>
<!-- Document Switcher -->
<section class="flex flex-col gap-2">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider pl-1">Required Documents</h3>
<div class="flex gap-3 overflow-x-auto no-scrollbar pb-2 pt-1 px-1 -mx-1 snap-x">
<button class="snap-start shrink-0 px-4 py-2 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md border border-primary-container whitespace-nowrap shadow-sm transition-transform active:scale-95">
                    Gov ID
                </button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full bg-surface-container-lowest text-on-surface border border-outline-variant hover:bg-surface-variant/50 font-label-md text-label-md whitespace-nowrap transition-transform active:scale-95">
                    Trade License
                </button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full bg-surface-container-lowest text-on-surface border border-outline-variant hover:bg-surface-variant/50 font-label-md text-label-md whitespace-nowrap transition-transform active:scale-95 flex items-center gap-2">
                    Insurance
                    <span class="material-symbols-outlined text-[14px] text-secondary" data-icon="check_circle">check_circle</span>
</button>
</div>
</section>
<!-- Document Preview Canvas -->
<section class="flex-1 flex flex-col bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden min-h-[300px] relative">
<!-- Controls Overlay -->
<div class="absolute top-2 right-2 flex flex-col gap-2 z-10">
<button class="w-10 h-10 rounded-full bg-surface/90 backdrop-blur shadow-md flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="zoom_in">zoom_in</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface/90 backdrop-blur shadow-md flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="zoom_out">zoom_out</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface/90 backdrop-blur shadow-md flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="rotate_90_degrees_cw">rotate_90_degrees_cw</span>
</button>
</div>
<!-- The Image -->
<div class="flex-1 bg-surface-container-low flex items-center justify-center p-4 overflow-auto">
<img class="max-w-full rounded shadow-sm object-contain origin-center transition-transform duration-300" data-alt="A highly detailed fictional driver's license ID card lying flat on a minimalist grey desk surface, sharp overhead lighting, visible micro-textures on the plastic card, featuring a photo of a male electrician, crisp text and barcodes, professional realistic rendering." id="doc-preview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAIsrvzlmYXz5Szc1kFJiIs5XbDSYDSs7XneVc3WhKufUEg3I7_eQHYbmzf7W8Awe94VZ9-stynSEAQfQDVystyOW0L48Ob9G57l_EB4NGlOuUERcsQr2K0Q8mzVHA1zdvuazsMiakT1Cs2USrnutxoxaK6j55h6BboYGEbEYGzBOXyBURZa-gj8ZnuP3QokLB8a4jNWDlnql2ipmDRUwRCr9XI004XW3cwLwg3xMYIeX0TIE7cFVbo"/>
</div>
<!-- Document Meta -->
<div class="p-3 bg-surface border-t border-outline-variant/30 flex justify-between items-center">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Uploaded: Today, 10:42 AM</p>
<p class="font-body-sm text-body-sm text-on-surface">File: gov_id_front.jpg (2.4MB)</p>
</div>
</div>
</section>
</main>
<!-- Fixed Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-xl border-t border-outline-variant/30 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] p-4 pb-safe flex gap-3 z-50">
<button class="flex-1 py-4 px-4 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md shadow-sm flex flex-col items-center justify-center gap-1 hover:bg-surface-variant/50 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-outline" data-icon="flag">flag</span>
<span>Request Clarification</span>
</button>
<button class="flex-1 py-4 px-4 rounded-xl bg-primary text-on-primary font-label-md text-label-md shadow-md flex flex-col items-center justify-center gap-1 hover:bg-primary-fixed-variant transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="thumb_up">thumb_up</span>
<span>Approve Document</span>
</button>
</div>
</body></html>

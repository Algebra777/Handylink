<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('go-live-btn');
            const statusText = document.getElementById('status-text');
            const statusSubtext = document.getElementById('status-subtext');
            const statusIcon = document.getElementById('status-icon');
            const statusIconBg = document.getElementById('status-icon-bg');
            const hoursWorkedDisplay = document.getElementById('hours-worked');
            
            let isOnline = false;
            let timerInterval;
            let secondsWorked = 0;

            function formatTime(seconds) {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                return `${h}h ${m}m`;
            }

            btn.addEventListener('click', () => {
                isOnline = !isOnline;
                
                if (isOnline) {
                    // Go Online State
                    btn.textContent = 'Go Offline';
                    btn.classList.replace('bg-primary', 'bg-error');
                    btn.classList.replace('text-on-primary', 'text-on-error');
                    
                    statusText.textContent = 'Online & Receiving Leads';
                    statusText.classList.replace('text-on-surface', 'text-primary');
                    
                    statusSubtext.textContent = 'Looking for nearby jobs...';
                    
                    statusIcon.textContent = 'radar';
                    statusIcon.classList.add('animate-spin', 'text-primary');
                    statusIconBg.classList.replace('bg-surface-container-high', 'bg-primary-container');
                    statusIconBg.classList.replace('text-outline', 'text-on-primary-container');

                    // Start Timer
                    timerInterval = setInterval(() => {
                        secondsWorked += 60; // Simulating minutes for faster testing visually if needed, but normally +1
                        hoursWorkedDisplay.textContent = formatTime(secondsWorked);
                    }, 60000); // Update every minute

                } else {
                    // Go Offline State
                    btn.textContent = 'Go Online';
                    btn.classList.replace('bg-error', 'bg-primary');
                    btn.classList.replace('text-on-error', 'text-on-primary');
                    
                    statusText.textContent = 'Offline';
                    statusText.classList.replace('text-primary', 'text-on-surface');
                    
                    statusSubtext.textContent = 'You are not receiving leads.';
                    
                    statusIcon.textContent = 'power_settings_new';
                    statusIcon.classList.remove('animate-spin', 'text-primary');
                    statusIconBg.classList.replace('bg-primary-container', 'bg-surface-container-high');
                    statusIconBg.classList.replace('text-on-primary-container', 'text-outline');

                    // Stop Timer
                    clearInterval(timerInterval);
                }
            });
        });
    </script>

<script>
        // Simple JS to update the summary card based on selection
        document.querySelectorAll('input[name="service"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const summaryTitle = document.querySelector('.sticky span.font-body-lg');
                const summaryPrice = document.querySelector('.sticky span.font-headline-sm.text-primary');
                
                const selectedLabel = e.target.closest('label');
                const title = selectedLabel.querySelector('h3').textContent;
                const price = selectedLabel.querySelector('.font-headline-sm:not(h3)').textContent;

                summaryTitle.textContent = title;
                
                // Keep the primary color styling but update value
                summaryPrice.textContent = price;
            });
        });
    </script>

<style>
        .glass-panel {
            background: rgba(248, 249, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container flex flex-col min-h-screen pb-24">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-50 bg-surface/70 backdrop-blur-xl shadow-sm">
<div class="flex justify-between items-center px-4 py-3 md:px-lg w-full max-w-container-max mx-auto">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full overflow-hidden flex-shrink-0 bg-surface-variant">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional headshot of a smiling user in a modern office setting. The lighting is bright and even, casting soft shadows. The background is slightly blurred to emphasize the subject. The color palette features cool blues and warm skin tones, aligning with a premium minimalist aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCnlBYvonu5FJb3QKmo8aGD7-M0TONyWx7-1EKgG4e4EAclTJDQl2HhYKrmue-mVbpFJ8VqqUdYPjVNR6-fjmyisJXgT41tfQxM_diedlFprinjW6LI6NkXbEuTE4RqXATlnX1caZRcbbsGGPi_r6mA0o_ItBySeDInfAyMIm8JHBL8xoWWaglds2j7GmeGs3AIVfbzqzjqjJEez_dKRl2lup-VkccrhCPq6iJVRQ-TqPFh-3Yjgbqr"/>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile font-bold text-primary">HandyLink</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<!-- Search & Filter Bar (Sticky below Header) -->
<div class="sticky top-[64px] w-full z-40 bg-surface/90 backdrop-blur-md border-b border-surface-variant px-4 py-3 shadow-[0_4px_12px_rgba(0,0,0,0.05)]">
<div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
<button class="flex-shrink-0 flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[18px]">tune</span>
                Filters
            </button>
<button class="flex-shrink-0 flex items-center gap-1 bg-surface-container px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md hover:bg-surface-variant transition-colors">
                Location
                <span class="material-symbols-outlined text-[18px]">keyboard_arrow_down</span>
</button>
<button class="flex-shrink-0 flex items-center gap-1 bg-surface-container px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-md hover:bg-surface-variant transition-colors">
                Price
                <span class="material-symbols-outlined text-[18px]">keyboard_arrow_down</span>
</button>
<button class="flex-shrink-0 flex items-center gap-1 bg-primary-container text-on-primary-container px-4 py-2 rounded-full font-label-md">
<span class="material-symbols-outlined text-[18px]">verified</span>
                Verified
            </button>
</div>
<div class="flex justify-between items-center mt-3 pt-2 border-t border-surface-variant">
<!-- DYNAMIC_ARTISAN_COUNT -->
<button class="flex items-center gap-1 text-primary font-label-md hover:opacity-80 transition-opacity">
                Best Match
                <span class="material-symbols-outlined text-[18px]">sort</span>
</button>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow px-4 py-md space-y-md">
<!-- DYNAMIC_ARTISAN_CARDS -->
</main>
<!-- Floating Action Button (Map View) -->
<button class="fixed bottom-[88px] right-4 bg-tertiary text-on-tertiary px-4 py-3 rounded-full shadow-[0_12px_24px_rgba(158,49,0,0.3)] flex items-center gap-2 font-label-md hover:scale-105 active:scale-95 transition-transform z-40">
<span class="material-symbols-outlined">map</span>
        Map View
    </button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/70 backdrop-blur-xl shadow-lg pb-safe">
<div class="flex justify-around items-center px-4 py-2 w-full">
<!-- Active Tab: Explore -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="search" style="font-variation-settings: 'FILL' 1;">search</span>
<span class="font-label-sm text-label-sm mt-1">Explore</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-full px-4 py-1 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="event_available">event_available</span>
<span class="font-label-sm text-label-sm mt-1">Bookings</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-full px-4 py-1 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="add">add</span>
<span class="font-label-sm text-label-sm mt-1">Post</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-full px-4 py-1 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="chat">chat</span>
<span class="font-label-sm text-label-sm mt-1">Messages</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-full px-4 py-1 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</button>
</div>
</nav>

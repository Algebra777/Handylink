<style>
        body {
            font-family: 'Public Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col pb-24">
<!-- TopAppBar -->
<header class="bg-surface-lowest dark:bg-on-tertiary-fixed text-primary dark:text-primary-fixed docked full-width top-0 border-b border-outline-variant dark:border-outline flat no shadows flex items-center justify-between px-margin-mobile h-16 w-full sticky z-40 bg-surface-lowest">
<button class="hover:bg-surface-container-low dark:hover:bg-tertiary-container transition-colors active:scale-95 transition-transform p-2 -ml-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight">Payment Methods</h1>
<button class="hover:bg-surface-container-low dark:hover:bg-tertiary-container transition-colors active:scale-95 transition-transform p-2 -mr-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="help_outline">help_outline</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-md pb-xl max-w-3xl mx-auto w-full flex flex-col gap-xl">
<!-- Saved Methods Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Saved Methods</h2>
<div class="flex flex-col gap-sm">
<!-- Visa Card -->
<div class="bg-surface-container-lowest rounded-xl p-gutter shadow-[0_4px_12px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_20px_rgba(0,0,0,0.08)] transition-shadow flex items-center justify-between border border-transparent hover:border-surface-variant cursor-pointer group">
<div class="flex items-center gap-gutter">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="credit_card">credit_card</span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface">Visa ending in 4242</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-normal">Expires 12/26</span>
</div>
</div>
<div class="flex items-center gap-sm">
<span class="bg-primary-container/10 text-primary-container font-label-sm text-label-sm px-2 py-1 rounded border border-primary-container/20">Default</span>
<span class="material-symbols-outlined text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity" data-icon="more_vert">more_vert</span>
</div>
</div>
<!-- Mastercard -->
<div class="bg-surface-container-lowest rounded-xl p-gutter shadow-[0_4px_12px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_20px_rgba(0,0,0,0.08)] transition-shadow flex items-center justify-between border border-transparent hover:border-surface-variant cursor-pointer group">
<div class="flex items-center gap-gutter">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="credit_card">credit_card</span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface">Mastercard ending in 8899</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-normal">Expires 05/25</span>
</div>
</div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity" data-icon="more_vert">more_vert</span>
</div>
</div>
</div>
</section>
<!-- Add New Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Add New</h2>
<div class="flex flex-col gap-base bg-surface-container-lowest rounded-xl p-gutter shadow-[0_4px_12px_rgba(0,0,0,0.05)]">
<!-- Add Card Option -->
<button class="flex items-center justify-between py-xs group hover:bg-surface-container-low transition-colors rounded-lg px-2 -mx-2">
<div class="flex items-center gap-gutter">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:text-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="add_card">add_card</span>
</div>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary-container transition-colors">Add Credit or Debit Card</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<div class="h-px bg-outline-variant/30 w-full"></div>
<!-- Link Bank Account Option -->
<button class="flex items-center justify-between py-xs group hover:bg-surface-container-low transition-colors rounded-lg px-2 -mx-2">
<div class="flex items-center gap-gutter">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:text-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
</div>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary-container transition-colors">Link Bank Account</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface-lowest dark:bg-on-tertiary-fixed shadow-[0_-4px_12px_rgba(0,0,0,0.05)] rounded-t-xl">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container hover:bg-surface-container-high dark:hover:bg-tertiary-container transition-all active:scale-90 transition-transform duration-200 p-2 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<!-- Bookings (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container hover:bg-surface-container-high dark:hover:bg-tertiary-container transition-all active:scale-90 transition-transform duration-200 p-2 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="calendar_today">calendar_today</span>
<span class="font-label-sm text-label-sm">Bookings</span>
</a>
<!-- Payments (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-xl px-3 py-1 hover:bg-surface-container-high dark:hover:bg-tertiary-container transition-all active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="payments" data-weight="fill" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-sm text-label-sm">Payments</span>
</a>
<!-- Profile (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container hover:bg-surface-container-high dark:hover:bg-tertiary-container transition-all active:scale-90 transition-transform duration-200 p-2 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>

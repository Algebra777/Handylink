<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-surface-lowest dark:bg-surface-container-lowest w-full top-0 sticky border-b border-outline-variant dark:border-outline z-40">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-max-width mx-desktop">
<button aria-label="Go back" class="hover:bg-surface-variant/50 dark:hover:bg-surface-variant/20 rounded-full transition-colors p-2 active:scale-95 duration-150 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed">Personal Information</h1>
<div class="w-10"></div> <!-- Spacer to balance header -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-max-width mx-desktop px-margin-mobile py-lg pb-xl">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center justify-center mb-xl">
<div class="relative group cursor-pointer mb-base">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-surface shadow-[0_4px_12px_rgba(0,0,0,0.05)] bg-surface-container">
<img alt="Profile Photo" class="w-full h-full object-cover" data-alt="A high-quality, professional headshot of a modern artisan, smiling softly in a brightly lit studio setting with a clean, light mode aesthetic, warm humanistic teal tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAOl7TalnXAfHpMxrL4yPNS0epY38Y1eq8YlDQD6dbwrXEonupeIWY1ENgIEPk4U5wjEjCm8ldQ15CNDGofL1SCe_B6qTobVtoFZ7G6Md2ZuEC9NpDTxgSZ-WSA5xfw04uo1Gg94LbNXU8Nw6XI6QYXRyb7huolEqt7aWe-yY_GCA57gito8cMoBNzBO0QHuj6w-RtsIYEoY6Exe--PZacvQ6bYw1sAaMlk2JHCjnxmpthakG82o7rn"/>
</div>
<div class="absolute inset-0 bg-black/40 rounded-full opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-white" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</div>
<button class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors">Change Photo</button>
</section>
<!-- Form Section -->
<form class="space-y-md max-w-2xl mx-auto">
<!-- Full Name -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="person">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-xl bg-surface-lowest text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all" id="fullName" placeholder="Enter your full name" type="text" value="Marcus Rivera"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-xl bg-surface-lowest text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all" id="email" placeholder="Enter your email" type="email" value="m.rivera@example.com"/>
</div>
</div>
<!-- Phone Number -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="phone">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="call">call</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-xl bg-surface-lowest text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all" id="phone" placeholder="Enter your phone number" type="tel" value="+1 555-0123"/>
</div>
</div>
<!-- Bio/Description -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="bio">Bio &amp; Specialization</label>
<textarea class="block w-full p-3 border border-outline-variant rounded-xl bg-surface-lowest text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all resize-y" id="bio" placeholder="Describe your artisan skills, experience, and what makes your service unique..." rows="4">Master electrician with over 15 years of experience in residential and commercial wiring. Specializing in energy-efficient smart home upgrades and emergency repairs. Dedicated to safe, reliable, and neat installations.</textarea>
<p class="text-right font-label-sm text-label-sm text-outline mt-1">214 / 500</p>
</div>
</form>
</main>
<!-- Bottom Fixed Action Area -->
<div class="fixed bottom-0 w-full bg-surface-lowest border-t border-surface-variant p-4 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] z-40 md:relative md:bg-transparent md:border-none md:shadow-none md:p-0 md:mt-lg md:mb-xl md:max-w-2xl md:mx-auto">
<button class="w-full bg-primary-container text-white font-label-md text-label-md rounded-[16px] py-4 px-6 flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-[0.98] duration-150 min-h-[48px] shadow-[0_4px_12px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_20px_rgba(0,0,0,0.08)]" type="button">
<span class="material-symbols-outlined" data-icon="save">save</span>
            Save Changes
        </button>
</div>

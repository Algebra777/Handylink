<span class="material-symbols-outlined px-1" data-value="3">star</span>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('.star-rating .material-symbols-outlined');
            const feedbackText = document.getElementById('rating-feedback');
            const nextBtn = document.getElementById('next-btn');
            const feedbackLabels = {
                1: "Poor",
                2: "Fair",
                3: "Good",
                4: "Very Good",
                5: "Excellent"
            };

            stars.forEach(star => {
                star.addEventListener('click', (e) => {
                    const value = parseInt(e.target.getAttribute('data-value'));
                    
                    // Reset all
                    stars.forEach(s => s.classList.remove('active'));
                    
                    // Add active to clicked and all subsequent (visually preceding due to flex-row-reverse)
                    e.target.classList.add('active');
                    let next = e.target.nextElementSibling;
                    while(next) {
                        next.classList.add('active');
                        next = next.nextElementSibling;
                    }

                    // Update UI state
                    feedbackText.textContent = feedbackLabels[value];
                    feedbackText.classList.remove('hidden');
                    nextBtn.disabled = false;
                });
            });
        });
    </script>

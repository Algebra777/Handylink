<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest border-b border-outline-variant w-full top-0 sticky z-50">
<div class="flex justify-between items-center px-md py-sm w-full max-w-max-width mx-margin-desktop">
<div class="flex items-center gap-sm">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors cursor-pointer active:opacity-80 text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<div class="font-headline-md text-headline-md font-bold text-primary text-center absolute left-1/2 -translate-x-1/2">
                HandyLink
            </div>
<div class="flex items-center gap-sm text-on-surface-variant invisible">
<!-- Spacer for centering -->
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-2xl mx-auto px-margin-mobile md:px-md py-lg flex flex-col gap-xl">
<!-- Header / Context -->
<section class="flex flex-col gap-sm items-center text-center">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Step 2 of 2</p>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Write a Review</h1>
<div class="flex items-center gap-sm mt-xs bg-surface-container-lowest px-md py-sm rounded-full shadow-sm border border-outline-variant/30">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-variant flex-shrink-0">
<img alt="Artisan profile" class="w-full h-full object-cover" data-alt="A close up portrait of a middle aged male electrician in a blue work shirt, smiling warmly in a bright modern workshop. The lighting is soft and natural, conveying trust and professionalism in a clean environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBfXRbuXSUyZs3V5LuT4bgOHFQHfTtkE5jdC8YWrXu1g3iA9oWe6nzXOYgTvSGrZW-vCpA9u_QSYrGwJcZaNm9pKcJ7fL9EaZuLKjcFM8zHtSU4SzHxLCwsUaq3G1WnUVcyutXQ10b_HVdSIcOufxRdydx_hwxl6GaTzlOEvBoLD-og1pnHohcJbLyeV1kBhf_YZGn5PtDj5w0ZFc3s2FG4-_TR__8OzEsWw3wXJnrrFoO2zDaXRVS2"/>
</div>
<div class="flex flex-col items-start text-left">
<span class="font-label-md text-label-md text-on-surface">Marcus T.</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Lighting Installation</span>
</div>
</div>
</section>
<!-- Form Area -->
<section class="flex flex-col gap-md">
<!-- Details Area -->
<div class="flex flex-col gap-xs">
<label class="font-headline-md text-headline-md text-on-surface" for="review-details">Share more details</label>
<p class="font-body-md text-body-md text-on-surface-variant mb-xs">What did they do well? Was there anything that could be improved? Your detailed feedback helps others.</p>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all resize-none shadow-sm" id="review-details" placeholder="e.g. Marcus arrived on time and installed the new chandelier perfectly. He even cleaned up the dust afterwards..." rows="6"></textarea>
</div>
<!-- Photo Upload Area -->
<div class="flex flex-col gap-xs mt-sm">
<div class="flex justify-between items-end mb-xs">
<label class="font-headline-md text-headline-md text-on-surface">Add Photos <span class="font-body-md text-body-md text-on-surface-variant font-normal">(Optional)</span></label>
</div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-sm">
<!-- Upload Button / Dropzone -->
<button class="flex flex-col items-center justify-center gap-sm bg-surface-container-low border-2 border-dashed border-outline-variant rounded-xl aspect-square hover:bg-surface-container-high hover:border-primary transition-colors cursor-pointer text-on-surface-variant group">
<span class="material-symbols-outlined text-[32px] group-hover:text-primary transition-colors" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label-md text-label-md">Upload</span>
</button>
<!-- Thumbnail Placeholder 1 (Hidden by default, shown for demo) -->
<div class="relative rounded-xl overflow-hidden aspect-square border border-outline-variant shadow-sm group hidden">
<img alt="Uploaded photo 1" class="w-full h-full object-cover" data-alt="A cleanly installed modern pendant light hanging over a kitchen island, illuminated brightly. The background is slightly blurred showing a modern kitchen setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDLxRuf_7VcBn4Bha_GHAA2XRow2fPUrfyNUYVXSy0fydvzo2bgRKDEuUqYIiW-RO8hRGGB-OcS_uVJB2JwtJD5j3CBBLOysQ2X6_VZ4J6Ja-_eAq8CEmwqPAP62Iun0ZAdC0tsMGBiHTE3gn2p32XZn9lXgRHMVdI7AgHqRbF9VyIthm7gSnwQhTZtVLwjxCvgnNPTTFu8rY2z_OvfFeG1zNQ1VIcVu8L7Hfj-wjhzIppdAhcdRyaZ"/>
<button class="absolute top-2 right-2 bg-surface/80 rounded-full p-1 text-error hover:bg-surface opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[16px]" data-icon="close">close</span>
</button>
</div>
</div>
</div>
</section>
<!-- Actions -->
<section class="mt-auto pt-lg flex flex-col gap-sm pb-xl">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-md rounded-xl shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex justify-center items-center gap-xs">
                Submit Review
            </button>
<button class="w-full bg-transparent text-primary font-label-md text-label-md py-sm rounded-xl hover:bg-surface-container-low transition-colors">
                Skip for now
            </button>
</section>
</main>
<!-- Suppressed Nav Shells as per instructions (Transactional / Focus page) -->
</body></html>
